services:
  vision-edge:
    build:
      context: ../vision-service
      dockerfile: Dockerfile
    container_name: retail-brain-vision-edge
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:3000}
      - EDGE_API_KEY=${EDGE_API_KEY:-dev-edge-key}
      - YOLO_MODEL=yolov8n.pt
      - YOLO_CONF=0.45
